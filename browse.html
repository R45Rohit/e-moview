</head>
<body>
  <div id="nav-container"></div>

  <main class="page">
    <div class="container">
      <!-- Breadcrumbs -->
      <nav class="breadcrumbs" aria-label="Breadcrumb">
        <a href="/">Home</a>
        <span class="breadcrumbs-separator" aria-hidden="true">/</span>
        <span class="breadcrumbs-current" aria-current="page">Browse Requests</span>
      </nav>

      <div class="section-header fade-in">
        <div>
          <h1 class="section-title">Browse Movie Requests &amp; Recommendations</h1>
          <p class="section-subtitle">Discover community requests, filter by genre and mood, or suggest movies to fellow film lovers.</p>
        </div>
      </div>

      <!-- Filter Bar -->
      <div class="filter-bar fade-in" id="filterBar" role="search" aria-label="Filter movie requests">
        <div class="filter-group" style="flex: 1.5; min-width: 200px;">
          <label class="filter-label" for="searchRequests">Search Requests</label>
          <input type="text" id="searchRequests" class="form-input" placeholder="Search keywords, movies, or vibes..." aria-label="Search keywords or titles">
        </div>
        <div class="filter-group">
          <label class="filter-label" for="filterGenre">Genre</label>
          <select id="filterGenre" class="form-select" aria-label="Filter by genre">
            <option value="">All Genres</option>
            <option value="Action">Action</option>
            <option value="Comedy">Comedy</option>
            <option value="Horror">Horror</option>
            <option value="Thriller">Thriller</option>
            <option value="Romance">Romance</option>
            <option value="Drama">Drama</option>
            <option value="Sci-Fi">Sci-Fi</option>
            <option value="Any">Any</option>
          </select>
        </div>
        <div class="filter-group">
          <label class="filter-label" for="filterLanguage">Language</label>
          <select id="filterLanguage" class="form-select" aria-label="Filter by language">
            <option value="">All Languages</option>
            <option value="English">English</option>
            <option value="Hindi">Hindi</option>
            <option value="Marathi">Marathi</option>
            <option value="Korean">Korean</option>
            <option value="Tamil">Tamil</option>
            <option value="Any">Any</option>
          </select>
        </div>
        <div class="filter-group">
          <label class="filter-label" for="filterMood">Mood</label>
          <select id="filterMood" class="form-select" aria-label="Filter by mood">
            <option value="">All Moods</option>
            <option value="Relaxing">Relaxing</option>
            <option value="Funny">Funny</option>
            <option value="Dark">Dark</option>
            <option value="Emotional">Emotional</option>
            <option value="Exciting">Exciting</option>
            <option value="Feel-good">Feel-good</option>
          </select>
        </div>
      </div>

      <!-- Request Cards Grid -->
      <div class="grid grid-3" id="requestsGrid" aria-live="polite">
        <!-- Populated by browse.js -->
      </div>

      <!-- Load More -->
      <div class="text-center mt-xl" id="loadMoreContainer" style="display:none;">
        <button class="btn btn-secondary" id="loadMoreBtn">Load More Requests</button>
      </div>
    </div>

    <footer class="footer">
      <p><strong>Moview</strong> (e-moview) — People helping people choose movies.</p>
      <p style="margin-top:8px;font-size:0.85rem;opacity:0.7;">
        <a href="/movies" style="color:inherit;">🎬 Explore 200+ Top Movies</a> &nbsp;·&nbsp;
        <a href="/" style="color:inherit;">Home</a> &nbsp;·&nbsp;
        <a href="/ask" style="color:inherit;">Ask a Question</a>
      </p>
    </footer>
  </main>

  <!-- Static Store & Scripts -->
  <script src="js/auth.js"></script>
  <script src="js/analytics.js"></script>
  <script src="js/browse.js"></script>
</body>
</html>
