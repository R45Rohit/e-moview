<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Browse Movie Requests — MovieSuggest</title>
  <meta name="description" content="Browse community requests for movie recommendations. Filter by genre, language, and mood to find requests you can help with.">
  <meta name="theme-color" content="#07070d">
  <link rel="canonical" href="https://your-project.web.app/browse.html">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="nav-container"></div>

  <main class="page">
    <div class="container">
      <div class="section-header fade-in">
        <div>
          <h1 class="section-title">Browse Requests</h1>
          <p class="section-subtitle">See what the community is looking for and suggest movies</p>
        </div>
      </div>

      <!-- Filter Bar -->
      <div class="filter-bar fade-in" id="filterBar">
        <div class="filter-group">
          <label class="filter-label" for="filterGenre">Genre</label>
          <select id="filterGenre" class="form-select">
            <option value="">All Genres</option>
            <option value="Action">Action</option>
            <option value="Comedy">Comedy</option>
            <option value="Horror">Horror</option>
            <option value="Thriller">Thriller</option>
            <option value="Romance">Romance</option>
            <option value="Drama">Drama</option>
            <option value="Sci-Fi">Sci-Fi</option>
            <option value="Any">Any</option>
          </select>
        </div>
        <div class="filter-group">
          <label class="filter-label" for="filterLanguage">Language</label>
          <select id="filterLanguage" class="form-select">
            <option value="">All Languages</option>
            <option value="English">English</option>
            <option value="Hindi">Hindi</option>
            <option value="Marathi">Marathi</option>
            <option value="Korean">Korean</option>
            <option value="Tamil">Tamil</option>
            <option value="Any">Any</option>
          </select>
        </div>
        <div class="filter-group">
          <label class="filter-label" for="filterMood">Mood</label>
          <select id="filterMood" class="form-select">
            <option value="">All Moods</option>
            <option value="Relaxing">Relaxing</option>
            <option value="Funny">Funny</option>
            <option value="Dark">Dark</option>
            <option value="Emotional">Emotional</option>
            <option value="Exciting">Exciting</option>
            <option value="Feel-good">Feel-good</option>
          </select>
        </div>
      </div>

      <!-- Request Cards Grid -->
      <div class="grid grid-3" id="requestsGrid">
        <!-- Populated by browse.js -->
      </div>

      <!-- Load More -->
      <div class="text-center mt-xl" id="loadMoreContainer" style="display:none;">
        <button class="btn btn-secondary" id="loadMoreBtn">Load More Requests</button>
      </div>
    </div>

    <footer class="footer">
      <p>MovieSuggest — People helping people choose movies.</p>
    </footer>
  </main>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-analytics-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/analytics.js"></script>
  <script src="js/browse.js"></script>
</body>
</html>
