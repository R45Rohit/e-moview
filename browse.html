<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Primary SEO -->
  <title>Browse Movie Recommendation Requests — MovieSuggest</title>
  <meta name="description" content="Browse hundreds of community movie recommendation requests on MovieSuggest. Filter by genre (Action, Comedy, Horror, Sci-Fi, Romance, Drama, Thriller), language (English, Hindi, Tamil, Korean, Marathi), and mood. Help others find their next favourite film.">
  <meta name="keywords" content="browse movie requests, community movie recommendations, movie suggestions by genre, movie suggestions by language, best movies by mood, find a movie to watch, movie picks community, top movie recommendations, Hollywood suggestions, Bollywood suggestions, Korean drama suggestions, movie recommendation requests, what to watch tonight, movie ideas by genre">
  <meta name="author" content="MovieSuggest">
  <meta name="robots" content="index, follow">
  <meta name="theme-color" content="#07070d">
  <link rel="canonical" href="https://e-moview.onrender.com/browse.html">

  <!-- Open Graph -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="MovieSuggest">
  <meta property="og:title" content="Browse Movie Recommendation Requests — MovieSuggest">
  <meta property="og:description" content="See what movies the community is looking for and help suggest the perfect film. Filter by genre, language, and mood.">
  <meta property="og:url" content="https://e-moview.onrender.com/browse.html">
  <meta property="og:image" content="https://e-moview.onrender.com/og-image.png">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Browse Movie Recommendation Requests — MovieSuggest">
  <meta name="twitter:description" content="Help others find their next movie. Browse community requests filtered by genre, language, and mood.">
  <meta name="twitter:image" content="https://e-moview.onrender.com/og-image.png">

  <!-- JSON-LD Structured Data -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "CollectionPage",
    "name": "Browse Movie Requests",
    "url": "https://e-moview.onrender.com/browse.html",
    "description": "Community movie recommendation requests filtered by genre, language and mood.",
    "breadcrumb": {
      "@type": "BreadcrumbList",
      "itemListElement": [
        {"@type": "ListItem", "position": 1, "name": "Home", "item": "https://e-moview.onrender.com/"},
        {"@type": "ListItem", "position": 2, "name": "Browse Requests", "item": "https://e-moview.onrender.com/browse.html"}
      ]
    }
  }
  </script>

  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="nav-container"></div>

  <main class="page">
    <div class="container">
      <div class="section-header fade-in">
        <div>
          <h1 class="section-title">Browse Requests</h1>
          <p class="section-subtitle">See what the community is looking for and suggest movies</p>
        </div>
      </div>

      <!-- Filter Bar -->
      <div class="filter-bar fade-in" id="filterBar">
        <div class="filter-group">
          <label class="filter-label" for="filterGenre">Genre</label>
          <select id="filterGenre" class="form-select">
            <option value="">All Genres</option>
            <option value="Action">Action</option>
            <option value="Comedy">Comedy</option>
            <option value="Horror">Horror</option>
            <option value="Thriller">Thriller</option>
            <option value="Romance">Romance</option>
            <option value="Drama">Drama</option>
            <option value="Sci-Fi">Sci-Fi</option>
            <option value="Any">Any</option>
          </select>
        </div>
        <div class="filter-group">
          <label class="filter-label" for="filterLanguage">Language</label>
          <select id="filterLanguage" class="form-select">
            <option value="">All Languages</option>
            <option value="English">English</option>
            <option value="Hindi">Hindi</option>
            <option value="Marathi">Marathi</option>
            <option value="Korean">Korean</option>
            <option value="Tamil">Tamil</option>
            <option value="Any">Any</option>
          </select>
        </div>
        <div class="filter-group">
          <label class="filter-label" for="filterMood">Mood</label>
          <select id="filterMood" class="form-select">
            <option value="">All Moods</option>
            <option value="Relaxing">Relaxing</option>
            <option value="Funny">Funny</option>
            <option value="Dark">Dark</option>
            <option value="Emotional">Emotional</option>
            <option value="Exciting">Exciting</option>
            <option value="Feel-good">Feel-good</option>
          </select>
        </div>
      </div>

      <!-- Request Cards Grid -->
      <div class="grid grid-3" id="requestsGrid">
        <!-- Populated by browse.js -->
      </div>

      <!-- Load More -->
      <div class="text-center mt-xl" id="loadMoreContainer" style="display:none;">
        <button class="btn btn-secondary" id="loadMoreBtn">Load More Requests</button>
      </div>
    </div>

    <footer class="footer">
      <p>MovieSuggest — People helping people choose movies.</p>
    </footer>
  </main>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-analytics-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/analytics.js"></script>
  <script src="js/browse.js"></script>
</body>
</html>
