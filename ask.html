<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ask for a Movie Recommendation — MovieSuggest</title>
  <meta name="description" content="Tell the community what kind of movie you want to watch. Describe your mood and preferences, and get personalized suggestions from real people.">
  <meta name="theme-color" content="#07070d">
  <link rel="canonical" href="https://your-project.web.app/ask.html">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="nav-container"></div>

  <main class="page">
    <div class="container container-narrow">
      <div class="section-header fade-in" style="justify-content:center;">
        <div style="text-align:center;">
          <h1 class="section-title">Ask for a Recommendation</h1>
          <p class="section-subtitle">Tell the community what you're in the mood for</p>
        </div>
      </div>

      <div class="auth-card fade-in-up" id="askFormCard">
        <form id="askForm">
          <div class="form-group">
            <label class="form-label" for="genre">Genre</label>
            <select id="genre" class="form-select" required>
              <option value="" disabled selected>Select a genre</option>
              <option value="Action">Action</option>
              <option value="Comedy">Comedy</option>
              <option value="Horror">Horror</option>
              <option value="Thriller">Thriller</option>
              <option value="Romance">Romance</option>
              <option value="Drama">Drama</option>
              <option value="Sci-Fi">Sci-Fi</option>
              <option value="Any">Any Genre</option>
            </select>
          </div>

          <div class="form-group">
            <label class="form-label" for="language">Language</label>
            <select id="language" class="form-select" required>
              <option value="" disabled selected>Select a language</option>
              <option value="English">English</option>
              <option value="Hindi">Hindi</option>
              <option value="Marathi">Marathi</option>
              <option value="Korean">Korean</option>
              <option value="Tamil">Tamil</option>
              <option value="Any">Any Language</option>
            </select>
          </div>

          <div class="form-group">
            <label class="form-label" for="mood">Mood</label>
            <select id="mood" class="form-select" required>
              <option value="" disabled selected>What's your mood?</option>
              <option value="Relaxing">Relaxing</option>
              <option value="Funny">Funny</option>
              <option value="Dark">Dark</option>
              <option value="Emotional">Emotional</option>
              <option value="Exciting">Exciting</option>
              <option value="Feel-good">Feel-good</option>
            </select>
          </div>

          <div class="form-group">
            <label class="form-label" for="description">What are you looking for?</label>
            <textarea id="description" class="form-textarea" placeholder="e.g. I want an exciting movie for tonight with a strong story and great acting..." required minlength="10" maxlength="500"></textarea>
            <div class="char-count"><span id="charCount">0</span>/500</div>
          </div>

          <button type="submit" class="btn btn-primary btn-block btn-lg" id="submitBtn">
            🎬 Post Request
          </button>
        </form>
      </div>

      <!-- Auth Guard Message (shown to guests) -->
      <div class="empty-state hidden fade-in" id="authGuard">
        <div class="empty-state-icon">🔒</div>
        <h3 class="empty-state-title">Account Required</h3>
        <p class="empty-state-text">You need a registered account to ask for movie recommendations.</p>
        <a href="auth.html?mode=register&redirect=ask.html" class="btn btn-primary">Create Account</a>
        <a href="auth.html?mode=login&redirect=ask.html" class="btn btn-secondary" style="margin-left:12px;">Login</a>
      </div>
    </div>

    <footer class="footer">
      <p>MovieSuggest — People helping people choose movies.</p>
    </footer>
  </main>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-analytics-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/analytics.js"></script>
  <script src="js/ask.js"></script>
</body>
</html>
