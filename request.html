<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Primary SEO -->
  <title>Movie Recommendation Request Details — MovieSuggest</title>
  <meta name="description" content="View this community movie recommendation request and see film suggestions recommended by real movie lovers. Add your own recommendation or browse suggestions.">
  <meta name="keywords" content="movie request, movie suggestions, film recommendations, what to watch, community movie picks, movie opinions">
  <meta name="author" content="MovieSuggest">
  <meta name="robots" content="index, follow">
  <meta name="theme-color" content="#07070d">
  <link rel="canonical" href="https://e-moview.onrender.com/request.html">

  <!-- Open Graph -->
  <meta property="og:type" content="article">
  <meta property="og:site_name" content="MovieSuggest">
  <meta property="og:title" content="Movie Recommendation Request — MovieSuggest">
  <meta property="og:description" content="See movie recommendations suggested by real people for this community request.">
  <meta property="og:url" content="https://e-moview.onrender.com/request.html">
  <meta property="og:image" content="https://e-moview.onrender.com/og-image.png">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Movie Recommendation Request — MovieSuggest">
  <meta name="twitter:description" content="See movie recommendations suggested by real people for this community request.">
  <meta name="twitter:image" content="https://e-moview.onrender.com/og-image.png">

  <!-- JSON-LD Breadcrumb -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "BreadcrumbList",
    "itemListElement": [
      {"@type": "ListItem", "position": 1, "name": "Home", "item": "https://e-moview.onrender.com/"},
      {"@type": "ListItem", "position": 2, "name": "Browse", "item": "https://e-moview.onrender.com/browse.html"},
      {"@type": "ListItem", "position": 3, "name": "Request", "item": "https://e-moview.onrender.com/request.html"}
    ]
  }
  </script>

  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="nav-container"></div>

  <main class="page">
    <div class="container container-narrow">
      <!-- Request Detail -->
      <div id="requestDetail">
        <div class="loading-center">
          <div class="spinner spinner-lg"></div>
          <p>Loading request...</p>
        </div>
      </div>

      <!-- Suggestions Section -->
      <div id="suggestionsSection" style="display:none;">
        <div class="section-header">
          <h2 class="section-title">💡 Movie Suggestions</h2>
          <span class="suggestion-count" id="sugCount"></span>
        </div>
        <div id="suggestionsList"></div>

        <!-- Suggest Movie Button -->
        <div class="text-center mt-xl" id="suggestBtnContainer">
          <button class="btn btn-primary btn-lg" id="suggestMovieBtn">
            🎬 Suggest a Movie
          </button>
        </div>

        <!-- Suggest Form (hidden by default) -->
        <div class="suggest-form hidden" id="suggestForm">
          <h3>🎬 Suggest a Movie</h3>
          <form id="suggestionForm">
            <div class="form-group">
              <label class="form-label" for="movieName">Movie Name</label>
              <input type="text" id="movieName" class="form-input" placeholder="e.g. Interstellar (2014)" required maxlength="200">
            </div>
            <div class="form-group">
              <label class="form-label" for="reason">Why do you recommend it?</label>
              <textarea id="reason" class="form-textarea" placeholder="e.g. Great choice if you like emotional science-fiction movies with a strong story..." required minlength="10" maxlength="500"></textarea>
              <div class="char-count"><span id="reasonCharCount">0</span>/500</div>
            </div>
            <div style="display:flex;gap:12px;">
              <button type="submit" class="btn btn-primary" id="submitSuggestionBtn">Submit Suggestion</button>
              <button type="button" class="btn btn-secondary" id="cancelSuggestBtn">Cancel</button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <footer class="footer">
      <p>MovieSuggest — People helping people choose movies.</p>
      <p style="margin-top:8px;font-size:0.8rem;opacity:0.5;">
        <a href="movies.html" style="color:inherit;">🎬 Explore 200+ Top Movies</a> &nbsp;·&nbsp;
        <a href="index.html" style="color:inherit;">Home</a> &nbsp;·&nbsp;
        <a href="browse.html" style="color:inherit;">Browse Requests</a>
      </p>
    </footer>
  </main>

  <!-- Static Store & Scripts -->
  <script src="js/auth.js"></script>
  <script src="js/analytics.js"></script>
  <script src="js/request.js"></script>
</body>
</html>
