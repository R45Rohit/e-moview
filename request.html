<body>
  <div id="nav-container"></div>

  <main class="page">
    <div class="container container-narrow">
      <!-- Breadcrumbs -->
      <nav class="breadcrumbs" aria-label="Breadcrumb">
        <a href="/">Home</a>
        <span class="breadcrumbs-separator" aria-hidden="true">/</span>
        <a href="/browse">Browse Requests</a>
        <span class="breadcrumbs-separator" aria-hidden="true">/</span>
        <span class="breadcrumbs-current" aria-current="page">Request Details</span>
      </nav>

      <!-- Request Detail -->
      <div id="requestDetail">
        <h1 class="section-title">Movie Recommendation Request</h1>
        <div class="loading-center">
          <div class="spinner spinner-lg"></div>
          <p>Loading community request...</p>
        </div>
      </div>

      <!-- Suggestions Section -->
      <div id="suggestionsSection" style="display:none;">
        <div class="section-header">
          <h2 class="section-title">💡 Movie Suggestions</h2>
          <span class="suggestion-count" id="sugCount"></span>
        </div>
        <div id="suggestionsList"></div>

        <!-- Suggest Movie Button -->
        <div class="text-center mt-xl" id="suggestBtnContainer">
          <button class="btn btn-primary btn-lg" id="suggestMovieBtn">
            🎬 Suggest a Movie
          </button>
        </div>

        <!-- Suggest Form (hidden by default) -->
        <div class="suggest-form hidden" id="suggestForm">
          <h3>🎬 Suggest a Movie</h3>
          <form id="suggestionForm">
            <div class="form-group">
              <label class="form-label" for="movieName">Movie Name</label>
              <input type="text" id="movieName" class="form-input" placeholder="e.g. Interstellar (2014)" required maxlength="200">
            </div>
            <div class="form-group">
              <label class="form-label" for="reason">Why do you recommend it?</label>
              <textarea id="reason" class="form-textarea" placeholder="e.g. Great choice if you like emotional science-fiction movies with a strong story..." required minlength="10" maxlength="500"></textarea>
              <div class="char-count"><span id="reasonCharCount">0</span>/500</div>
            </div>
            <div style="display:flex;gap:12px;">
              <button type="submit" class="btn btn-primary" id="submitSuggestionBtn">Submit Suggestion</button>
              <button type="button" class="btn btn-secondary" id="cancelSuggestBtn">Cancel</button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <footer class="footer">
      <p><strong>Moview</strong> (e-moview) — People helping people choose movies.</p>
      <p style="margin-top:8px;font-size:0.85rem;opacity:0.7;">

        <a href="/" style="color:inherit;">Home</a> &nbsp;·&nbsp;
        <a href="/browse" style="color:inherit;">Browse Requests</a>
      </p>
    </footer>
